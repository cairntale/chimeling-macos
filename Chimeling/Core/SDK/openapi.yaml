                        - "null"
                      format: date-time
                      description: The date-time notation as defined by RFC 3339, section 5.6, for
                        example, 2017-07-21T17:32:28Z
                      example: 2026-06-26T20:48:06+08:00
                    lastSeenAt:
                      type:
                        - string
                        - "null"
                      format: date-time
                      description: Maintained by the server. Set at registration and refreshed on
                        every authenticated request that targets the device.
                        Never accepted from clients.
                      example: 2026-06-26T20:48:06+08:00
                    userId:
                      type: string
                      pattern: ^user_\w{27}$
                      example: user_3G4vtDxd4i3FkoHz5dqnCz9Gsv0
                  required:
                    - id
                    - name
                    - platform
                    - createdAt
                    - updatedAt
                    - lastSeenAt
                    - userId
        "401":
          description: Unauthorized
