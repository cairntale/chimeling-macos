                  error:
                    type: object
                    properties:
                      name:
                        type: string
                        example: ZodError
                      message:
                        type: string
                    required:
                      - name
                      - message
                required:
                  - success
                  - error
        "401":
          description: Unauthorized
          content:
            text/plain:
              example: "Unauthorized: missing session token"
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            text/plain:
              example: Forbidden
              schema:
                type: string
        "404":
          description: Device not found
          content:
            text/plain:
              example: Device not found
              schema:
                type: string
  /api/v1/icons:
    post:
      operationId: registerIcon
      tags:
        - Icons
      summary: Register an icon
      description: The body is the raw image bytes. The server derives the SHA-256
        hash. Check existence with `HEAD /v1/icons/{hash}` before uploading.
        Allowed content types are `image/png`, `image/jpeg`, `image/webp`,
        `image/gif`, `image/tiff`, `image/avif`. Maximum size is 2 MiB and
        4096x4096 pixels. A square 512x512 PNG or WebP is recommended.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
          image/gif:
            schema:
              type: string
              format: binary
          image/tiff:
            schema:
              type: string
              format: binary
          image/avif:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The registered icon
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/icons/dffd6021bb2bd5b0af676290809ec3a53191dd81c7f70a4b28688a362182986f
              required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  hash:
                    type: string
                    pattern: ^[0-9a-f]{64}$
                    example: dffd6021bb2bd5b0af676290809ec3a53191dd81c7f70a4b28688a362182986f
                  contentType:
                    type: string
                    enum:
                      - image/png
                      - image/jpeg
                      - image/webp
                      - image/gif
                      - image/tiff
                      - image/avif
                    example: image/png
                    description: The detected media type of the stored bitmap. Allowed values are
                      `image/png`, `image/jpeg`, `image/webp`, `image/gif`,
                      `image/tiff`, `image/avif`.
                  createdAt:
                    type:
                      - string
                      - "null"
                    format: date-time
                    description: The date-time notation as defined by RFC 3339, section 5.6, for
                      example, 2017-07-21T17:32:28Z
                    example: 2026-06-26T20:48:06+08:00
                  updatedAt:
                    type:
                      - string
                      - "null"
                    format: date-time
                    description: The date-time notation as defined by RFC 3339, section 5.6, for
                      example, 2017-07-21T17:32:28Z
                    example: 2026-06-26T20:48:06+08:00
                required:
                  - hash
                  - contentType
                  - createdAt
                  - updatedAt
        "401":
          description: Unauthorized
          content:
            text/plain:
              example: "Unauthorized: missing session token"
              schema:
                type: string
        "409":
          description: An icon with the same hash already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Conflict
                required:
                  - error
        "413":
          description: Payload exceeds the 2 MiB size limit
          content:
            text/plain:
              example: Payload too large
              schema:
                type: string
        "415":
          description: Unsupported or undetectable media type. Allowed types are
            `image/png`, `image/jpeg`, `image/webp`, `image/gif`, `image/tiff`,
            `image/avif`.
          content:
            text/plain:
              example: Unsupported media type
              schema:
                type: string
