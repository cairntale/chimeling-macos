  /api/v1/devices/{deviceId}/presence:
    put:
      operationId: reportDevicePresence
      tags:
        - Presence
      summary: Report device presence
      description: An idempotent full overwrite of the stored presence. Heartbeats and
        change events share this shape. The stored presence expires 10 minutes
        after the last report.
      security:
        - Bearer: []
      parameters:
        - schema:
            type: string
            format: uuid
            example: da401463-eb58-4f43-bbd6-dc3a46379e9e
          required: true
          name: deviceId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            examples:
              online:
                value:
                  status: online
                  activity: &a1
                    appId: 8dc8f923-205d-4c77-a61c-739be43882db
                    startedAt: 2026-06-26T20:48:06+08:00
              idle:
                value:
                  status: idle
                  activity: *a1
              activity undisclosed:
                value:
                  status: online
                  activity: null
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - online
                    - idle
                  description: The device-reported state. `offline` is not a reportable value.
                    Going offline is `DELETE` on the presence path.
                  x-enum-descriptions:
                    online: The device is actively in use.
                    idle: The device is on but the user is away. The last activity stays attached.
                  example: online
                activity:
                  type:
                    - object
                    - "null"
                  properties:
                    appId:
                      type: string
                      format: uuid
                      example: 8dc8f923-205d-4c77-a61c-739be43882db
                      description: An app already registered on this device through `POST
                        /v1/devices/{deviceId}/apps`. Presence never creates
                        apps.
                    startedAt:
                      type: string
                      format: date-time
                      example: 2026-06-26T20:48:06+08:00
                      description: When the activity started, as observed by the device. Stored
                        verbatim.
                  required:
                    - appId
                    - startedAt
                  description: The current activity, or `null` to report status without disclosing
                    it.
              required:
                - status
                - activity
      responses:
        "204":
          description: Presence reported
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      name:
                        type: string
                        example: ZodError
                      message:
                        type: string
                    required:
                      - name
                      - message
                required:
                  - success
                  - error
        "401":
          description: Unauthorized
          content:
            text/plain:
              example: "Unauthorized: missing session token"
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            text/plain:
              example: Forbidden
              schema:
                type: string
        "404":
          description: Device not found
          content:
            text/plain:
              example: Device not found
              schema:
                type: string
        "422":
          description: The referenced app does not exist or is not owned by the device
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid reference
                required:
                  - error
    delete:
      operationId: clearDevicePresence
      tags:
        - Presence
      summary: Clear device presence
      description: Take the device offline. Succeeds even when the device is already
        offline.
      security:
        - Bearer: []
      parameters:
        - schema:
            type: string
            format: uuid
            example: da401463-eb58-4f43-bbd6-dc3a46379e9e
          required: true
          name: deviceId
