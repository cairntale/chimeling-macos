  /api/v1/presence/{userId}:
    get:
      operationId: getResolvedUserPresence
      tags:
        - Presence
      summary: Get the resolved presence of a user
      description: The resolved presence comes from the most recently reported
        `online` device, otherwise the most recently reported `idle` device,
        otherwise the user is `offline`. The response for an unknown user is
        identical to that for an offline user, so this endpoint does not reveal
        whether a user exists. Responses must not be cached.
      parameters:
        - schema:
            type: string
            pattern: ^user_\w{27}$
            example: user_3G4vtDxd4i3FkoHz5dqnCz9Gsv0
          required: true
          name: userId
          in: path
      responses:
        "200":
          description: The resolved presence
          content:
            application/json:
              examples:
                online:
                  value:
                    status: online
                    activity: &a2
                      gerund: writing code
                      appName: Xcode
                      iconHash: dffd6021bb2bd5b0af676290809ec3a53191dd81c7f70a4b28688a362182986f
                      startedAt: 2026-06-26T20:48:06+08:00
                idle:
                  value:
                    status: idle
                    activity: *a2
                offline:
                  value:
                    status: offline
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - offline
                    required:
                      - status
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - online
                      activity:
                        type:
                          - object
                          - "null"
                        properties:
                          gerund:
                            type: string
                            example: writing code
                            description: A complete server-produced phrase describing the activity,
                              currently the fixed placeholder `using the app`.
                          appName:
                            type: string
                            example: Xcode
                            description: The display name of the app.
                          iconHash:
                            type:
                              - string
                              - "null"
                            pattern: ^[0-9a-f]{64}$
                            example: dffd6021bb2bd5b0af676290809ec3a53191dd81c7f70a4b28688a362182986f
                            description: References the app icon served at `GET /v1/icons/{hash}/image`.
                          startedAt:
                            type: string
                            format: date-time
                            example: 2026-06-26T20:48:06+08:00
                            description: Device-reported activity start, for client-side duration math.
                        required:
                          - gerund
                          - appName
                          - iconHash
                          - startedAt
                        description: The resolved activity, or `null` when the device discloses nothing.
                    required:
                      - status
                      - activity
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - idle
                      activity:
                        type:
                          - object
                          - "null"
                        properties:
                          gerund:
                            type: string
                            example: writing code
                            description: A complete server-produced phrase describing the activity,
                              currently the fixed placeholder `using the app`.
                          appName:
                            type: string
                            example: Xcode
                            description: The display name of the app.
                          iconHash:
                            type:
                              - string
                              - "null"
                            pattern: ^[0-9a-f]{64}$
                            example: dffd6021bb2bd5b0af676290809ec3a53191dd81c7f70a4b28688a362182986f
                            description: References the app icon served at `GET /v1/icons/{hash}/image`.
                          startedAt:
                            type: string
                            format: date-time
                            example: 2026-06-26T20:48:06+08:00
                            description: Device-reported activity start, for client-side duration math.
                        required:
                          - gerund
                          - appName
                          - iconHash
                          - startedAt
                        description: The resolved activity, or `null` when the device discloses nothing.
                    required:
                      - status
                      - activity
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      name:
                        type: string
                        example: ZodError
                      message:
                        type: string
                    required:
                      - name
                      - message
                required:
                  - success
                  - error
        "503":
          description: Service unavailable
          headers:
            Retry-After:
              schema:
                type: string
                example: "5"
              required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Presence temporarily unavailable
                required:
                  - error
