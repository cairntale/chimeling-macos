                      example, 2017-07-21T17:32:28Z
                    example: 2026-06-26T20:48:06+08:00
                  lastOpenedAt:
                    type:
                      - string
                      - "null"
                    format: date-time
                    description: Maintained by the server. Set at registration and refreshed
                      whenever the app is updated or referenced in a presence
