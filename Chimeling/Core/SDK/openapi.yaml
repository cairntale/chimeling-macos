      description: Register an app on the device. The referenced `iconHash` must
        already exist, so register the icon before registering the app.
      security:
        - Bearer: []
      parameters:
        - schema:
            type: string
            format: uuid
            example: da401463-eb58-4f43-bbd6-dc3a46379e9e
          required: true
          name: deviceId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Xcode
                identifier:
                  type: string
                  example: com.apple.dt.Xcode
                iconHash:
                  type:
                    - string
                    - "null"
                  pattern: ^[0-9a-f]{64}$
                  example: dffd6021bb2bd5b0af676290809ec3a53191dd81c7f70a4b28688a362182986f
