openapi: 3.1.0
info:
  version: v1
  title: Chimeling API
  description: >-
    Chimeling publishes user presence for personal sites. A registered device
    reports what its user is doing. Anyone can read the resolved presence and
    embed it.


    > [!warning]

    > The API is currently unstable and may undergo breaking changes without
    notice.
tags:
  - name: Devices
    description: The registered clients that report presence.
  - name: Apps
    description: The apps registered on a device.
  - name: Icons
    description: Content-addressed app icons. The SHA-256 hash of the image bytes
      serves as the unique identifier. Uploads must be a bitmap (`image/png`,
      `image/jpeg`, `image/webp`, `image/gif`, `image/tiff`, `image/avif`).
      Maximum size is 2 MiB and 4096x4096 pixels. A square 512x512 PNG or WebP
      is recommended.
  - name: Presence
    description: The presence of a user's devices.
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      description: Clerk session token. Obtain it through the official Clerk SDK and
        send it as a Bearer credential.
  schemas: {}
  parameters: {}
paths:
  /api/v1/devices:
    post:
      operationId: registerDevice
      tags:
        - Devices
      summary: Register a device
      description: Register a new device for the authenticated user. Each device needs
        exactly one registration. Persist the returned ID. If a request with a
        stored ID returns 404, the device was deleted on the server, so register
        again and replace the stored ID.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: MacBook Air
                platform:
                  type: string
                  enum:
                    - darwin
                  example: darwin
              required:
                - name
                - platform
      responses:
        "201":
          description: The registered device
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: da401463-eb58-4f43-bbd6-dc3a46379e9e
                  name:
                    type: string
                    example: MacBook Air
                  platform:
                    type: string
                    enum:
                      - darwin
                    example: darwin
                  createdAt:
                    type:
                      - string
                      - "null"
                    format: date-time
                    description: The date-time notation as defined by RFC 3339, section 5.6, for
                      example, 2017-07-21T17:32:28Z
                    example: 2026-06-26T20:48:06+08:00
                  updatedAt:
                    type:
                      - string
                      - "null"
                    format: date-time
                    description: The date-time notation as defined by RFC 3339, section 5.6, for
                      example, 2017-07-21T17:32:28Z
                    example: 2026-06-26T20:48:06+08:00
                  lastSeenAt:
                    type:
                      - string
                      - "null"
                    format: date-time
                    description: Maintained by the server. Set at registration and refreshed on
                      every authenticated request that targets the device. Never
                      accepted from clients.
                    example: 2026-06-26T20:48:06+08:00
                  userId:
                    type: string
                    pattern: ^user_\w{27}$
                    example: user_3G4vtDxd4i3FkoHz5dqnCz9Gsv0
                required:
                  - id
                  - name
                  - platform
                  - createdAt
                  - updatedAt
                  - lastSeenAt
                  - userId
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      name:
                        type: string
                        example: ZodError
                      message:
                        type: string
                    required:
                      - name
                      - message
                required:
                  - success
                  - error
        "401":
          description: Unauthorized
          content:
            text/plain:
              example: "Unauthorized: missing session token"
              schema:
                type: string
    get:
      operationId: listDevices
      tags:
        - Devices
      summary: List devices
      description: List devices of the authenticated user, most recently seen first.
      security:
